name: CI CD EPS SURA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas Python
        run: python -m unittest discover -s python_project/tests -v

  pruebas-javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar pruebas JavaScript
        run: node --test

  build:
    needs: [pruebas-python, pruebas-javascript]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EPSSURAFRONT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: EPSSURAFRONT/dist
