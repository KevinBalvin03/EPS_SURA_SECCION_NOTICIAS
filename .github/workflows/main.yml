
name: CI CD EPS SURA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas Python
        run: |
          python -m unittest discover \
            -s python_project/tests \
            -p "test*.py" -v

  pruebas-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas JavaScript
        run: node --test javascript_project/tests/*.test.js

  deploy:
    needs: [pruebas-python, pruebas-javascript]
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar en Apache
        run: |
          echo "Pruebas aprobadas"
          echo "Preparando despliegue"
          # Pendiente: copiar el build a /var/www/html/
